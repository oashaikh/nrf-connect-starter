# Default Kconfig — overridden by board-specific files in boards/<board>.conf

# Console & logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# GPIO
CONFIG_GPIO=y

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Useful kernel features
CONFIG_THREAD_NAME=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=n

# Reboot on fault, hand off to debugger if attached
CONFIG_RESET_ON_FATAL_ERROR=y

# Library configuration
CONFIG_NEWLIB_LIBC=y

# Optional: enable for wireless work in your project
# CONFIG_BT=y
# CONFIG_BT_PERIPHERAL=y
# CONFIG_BT_DEVICE_NAME="ncs-starter"
