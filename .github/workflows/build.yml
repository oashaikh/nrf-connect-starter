name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.27.4
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        board:
          - native_sim
          - nrf52840dk/nrf52840
          - nrf52833dk/nrf52833
          - nrf5340dk/nrf5340/cpuapp

    env:
      CMAKE_PREFIX_PATH: /opt/toolchains

    steps:
      - uses: actions/checkout@v4
        with:
          path: nrf-connect-starter
          fetch-depth: 1

      - name: Initialise west workspace
        run: |
          west init -l nrf-connect-starter
          # Shallow clone everything to keep the download small (NCS is huge)
          west update -o=--depth=1 -n
          west zephyr-export

      - name: Build for ${{ matrix.board }}
        run: |
          west build -b ${{ matrix.board }} nrf-connect-starter/app -p auto

      - name: Binary size report
        if: success()
        run: west build -t rom_report || true

      - name: Upload artefacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.board }}
          path: |
            build/zephyr/zephyr.hex
            build/zephyr/zephyr.bin
            build/zephyr/zephyr.elf
            build/zephyr/zephyr.map
          if-no-files-found: ignore
